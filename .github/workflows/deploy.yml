name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Verify build output directory
        run: |
          if [ -d "out" ]; then
            echo "DEPLOY_DIR=out" >> $GITHUB_ENV
          elif [ -d "dist" ]; then
            echo "DEPLOY_DIR=dist" >> $GITHUB_ENV
          elif [ -d ".next" ]; then
            echo "DEPLOY_DIR=.next" >> $GITHUB_ENV
          else
            echo "❌ Build output directory not found!"
            ls -la
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_account_id }}
          projectName: info_maker
          directory: ${{ env.DEPLOY_DIR }}
